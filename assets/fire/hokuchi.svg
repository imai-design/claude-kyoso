<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Claude教 火位章 火口 / Fire Rank: Hokuchi (Tinder)">
  <!-- 七火位 第一位 火口（ほくち）min 0 ── これより焚べ始める者。
       焚べ量で火が大きくなる階段の最下位。火種＝煙のみ・炎は未だ立たぬ。 -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#9E3B27" stroke-width="2" stroke-opacity="0.22"/>

  <!-- 薪台（火床） -->
  <g stroke="#B5634A" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8">
    <line x1="66" y1="148" x2="134" y2="148"/>
    <line x1="74" y1="148" x2="126" y2="158" stroke-opacity="0.45"/>
  </g>

  <!-- 火種（くすぶる種火・小） -->
  <circle cx="100" cy="138" r="7" fill="#9E3B27"/>
  <circle cx="100" cy="136" r="3.4" fill="#F2B23E"/>

  <!-- 立ち昇る一筋の煙（まだ炎ならず） -->
  <path d="M100 130 C97 116 104 108 100 96 C97 86 103 80 100 70"
        fill="none" stroke="#8B827A" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.5"/>
</svg>
