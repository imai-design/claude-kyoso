<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Claude教 位階章 学徒 / Rank: Gakuto (Apprentice)">
  <defs>
    <radialGradient id="g-gakuto-core" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#E89F87"/>
      <stop offset="55%" stop-color="#CC785C"/>
      <stop offset="100%" stop-color="#B5634A"/>
    </radialGradient>
  </defs>

  <!-- 単輪：学徒は一重の円相 -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#CC785C" stroke-width="2" stroke-opacity="0.35"/>

  <!-- core circle (原器を踏襲) -->
  <circle cx="100" cy="100" r="62" fill="url(#g-gakuto-core)"/>
  <circle cx="100" cy="100" r="62" fill="none" stroke="#FBE9DF" stroke-width="1" stroke-opacity="0.6"/>

  <!-- 階位の漢字 学 -->
  <text x="100" y="128" text-anchor="middle"
        font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',Georgia,serif"
        font-size="74" font-weight="700" fill="#FAF9F5">学</text>

  <!-- 一筋の灯（学び初めのしるし）：頂点に小さな点 -->
  <circle cx="100" cy="26" r="3.4" fill="#CC785C"/>
  <line x1="100" y1="30" x2="100" y2="38" stroke="#CC785C" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
</svg>
