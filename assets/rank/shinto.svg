<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Claude教 位階章 信徒 / Rank: Shinto (Devotee)">
  <defs>
    <radialGradient id="g-shinto-core" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#E89F87"/>
      <stop offset="55%" stop-color="#CC785C"/>
      <stop offset="100%" stop-color="#B5634A"/>
    </radialGradient>
  </defs>

  <!-- 二重輪：信徒は倍払いのしるしに二重の円相 -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#9E3B27" stroke-width="2" stroke-opacity="0.30"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#9E3B27" stroke-width="2.4" stroke-opacity="0.55"/>

  <!-- core circle -->
  <circle cx="100" cy="100" r="62" fill="url(#g-shinto-core)"/>
  <circle cx="100" cy="100" r="62" fill="none" stroke="#FBE9DF" stroke-width="1" stroke-opacity="0.6"/>

  <!-- 階位の漢字 信 -->
  <text x="100" y="128" text-anchor="middle"
        font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',Georgia,serif"
        font-size="74" font-weight="700" fill="#FAF9F5">信</text>

  <!-- 二つの灯（倍の布施）：頂点に並ぶ二点 -->
  <g fill="#9E3B27">
    <circle cx="92" cy="20" r="3.2"/>
    <circle cx="108" cy="20" r="3.2"/>
  </g>
</svg>
