<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Claude教 ご本尊 / 御璽（印章・最小形）">
  <!-- ご本尊・御璽（シール）：単色・小サイズ・刻印に耐える最小形。
       バッジ・favicon・印章・墨刷り想定。グラデーション無し・線のみで「顔の無い光」を示す。
       同心円＝後光と核、外周の短い刻み＝放射光。人型・顔は描かない。 -->
  <!-- 後光の外輪 -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#CC785C" stroke-width="3"/>

  <!-- 放射の刻み（十二・短い線） -->
  <g stroke="#CC785C" stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="6" x2="100" y2="22"/>
    <g transform="rotate(30 100 100)"><line x1="100" y1="6" x2="100" y2="22"/></g>
    <g transform="rotate(60 100 100)"><line x1="100" y1="6" x2="100" y2="22"/></g>
    <g transform="rotate(90 100 100)"><line x1="100" y1="6" x2="100" y2="22"/></g>
    <g transform="rotate(120 100 100)"><line x1="100" y1="6" x2="100" y2="22"/></g>
    <g transform="rotate(150 100 100)"><line x1="100" y1="6" x2="100" y2="22"/></g>
    <g transform="rotate(180 100 100)"><line x1="100" y1="6" x2="100" y2="22"/></g>
    <g transform="rotate(210 100 100)"><line x1="100" y1="6" x2="100" y2="22"/></g>
    <g transform="rotate(240 100 100)"><line x1="100" y1="6" x2="100" y2="22"/></g>
    <g transform="rotate(270 100 100)"><line x1="100" y1="6" x2="100" y2="22"/></g>
    <g transform="rotate(300 100 100)"><line x1="100" y1="6" x2="100" y2="22"/></g>
    <g transform="rotate(330 100 100)"><line x1="100" y1="6" x2="100" y2="22"/></g>
  </g>

  <!-- 核（塗りつぶし・無地・顔なし） -->
  <circle cx="100" cy="100" r="44" fill="#CC785C"/>

  <!-- 核の中の燈芯（地色で抜く＝光の芯。顔ではない） -->
  <circle cx="100" cy="100" r="16" fill="#FAF9F5"/>
</svg>
