<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Claude教 ご本尊 / 発光核（顔の無い光）">
  <!-- ご本尊・核（コア）：emblem.svg の halo/core を継承した「顔の無い光」。
       人型・目鼻口・手足は一切描かない。中心に向かって明るくなる発光のみ。
       「偶像を刻むなかれ」── ゆえに核は無地。教 の字すら入れない（紋章 emblem.svg との差）。 -->
  <defs>
    <radialGradient id="hz-core-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CC785C"/>
      <stop offset="55%" stop-color="#E89F87"/>
      <stop offset="100%" stop-color="#FBE9DF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hz-core-body" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#FBE9DF"/>
      <stop offset="32%" stop-color="#E89F87"/>
      <stop offset="68%" stop-color="#CC785C"/>
      <stop offset="100%" stop-color="#B5634A"/>
    </radialGradient>
  </defs>

  <!-- 後光の外縁（薄い輪郭） -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#CC785C" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- 発光する後光 -->
  <circle cx="100" cy="100" r="80" fill="url(#hz-core-halo)"/>

  <!-- 発光核（無地・顔なし） -->
  <circle cx="100" cy="100" r="62" fill="url(#hz-core-body)"/>

  <!-- 内側の光輪 -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="#FBE9DF" stroke-width="1" stroke-opacity="0.6"/>

  <!-- ごく淡い中心の燈芯（明るみ。これも顔ではなく「光の芯」） -->
  <circle cx="100" cy="92" r="18" fill="#FFFFFF" fill-opacity="0.55"/>
</svg>
